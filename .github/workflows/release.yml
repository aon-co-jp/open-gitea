name: Release binaries

# タグ(例: v0.1.0)をpushすると、Linux(全ディストリ共通の静的musl
# バイナリ)・Windows(x86_64)向けにビルドし、GitHub Releasesへ添付する。
# AlmaLinux/Ubuntu/Debian/Fedora/RHEL等どのLinuxディストリでも、
# muslターゲットの静的バイナリなら追加ライブラリ無しでそのまま動く
# (glibcバージョン差異による非互換を避けるための選択)。
# WASM UI(static/配下、リポジトリにビルド済み成果物としてコミット済み)も
# 同梱する。

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (musl, 全ディストリ共通)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl target
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl --bin open-gitea
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/open-gitea dist/open-gitea
          cp install.sh dist/install.sh
          cp -r static dist/static
          tar -czf open-gitea-linux-x86_64.tar.gz -C dist open-gitea install.sh static
      - uses: actions/upload-artifact@v4
        with:
          name: open-gitea-linux-x86_64
          path: open-gitea-linux-x86_64.tar.gz

  build-windows:
    name: Windows (x86_64、Windows Server含む)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc --bin open-gitea
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/x86_64-pc-windows-msvc/release/open-gitea.exe dist/
          Copy-Item install.ps1 dist/
          Copy-Item static dist/static -Recurse
          Compress-Archive -Path dist/* -DestinationPath open-gitea-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: open-gitea-windows-x86_64
          path: open-gitea-windows-x86_64.zip

  release:
    name: GitHub Releaseへ添付
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            open-gitea-linux-x86_64/open-gitea-linux-x86_64.tar.gz
            open-gitea-windows-x86_64/open-gitea-windows-x86_64.zip
